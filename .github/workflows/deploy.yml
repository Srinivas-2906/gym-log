name: Deploy gym-log (gym-log.kaana.in)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-gym-log-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: kaana-prod

      - name: Submit Cloud Build
        run: |
          gcloud builds submit \
            --project kaana-prod \
            --config gcp/cloudbuild.yaml \
            --service-account=projects/kaana-prod/serviceAccounts/kaana-cloudbuild-deployer@kaana-prod.iam.gserviceaccount.com \
            .

      - name: Verify Cloud Run service
        run: |
          URL="$(gcloud run services describe gym-log \
            --project kaana-prod \
            --region asia-south1 \
            --format='value(status.url)')"
          echo "Checking ${URL}/"
          curl -fsS "${URL}/" -o /dev/null
          echo "Deploy OK: ${URL} (prod: https://gym-log.kaana.in)"
